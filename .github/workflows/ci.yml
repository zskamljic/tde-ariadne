name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    # The same Qt and compiler as the Arch packages are built with.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: >
          pacman -Syu --noconfirm --needed
          gcc pkgconf cmake ninja git qt6-base qt6-svg lua libarchive shared-mime-info
      - uses: actions/checkout@v4
      # Built along with Ariadne from a checkout next to it.
      - name: Fetch libtde
        run: git clone --depth 1 https://github.com/zskamljic/libtde.git ../libtde
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
      - name: Build
        run: cmake --build build
      - name: Test
        run: ctest --test-dir build --output-on-failure

  format:
    name: Formatting
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install clang-format
        run: pacman -Syu --noconfirm --needed clang git
      - uses: actions/checkout@v4
      - name: Check formatting
        run: git ls-files '*.cpp' '*.hpp' | xargs clang-format --dry-run --Werror
